<style>
:root{ --bg:#F0FDFA; --bg-soft:#CCFBF1; --card:#FFFFFF; --card-border:#5EEAD4; --text:#134E4A; --text-soft:#0D9488; --primary:#0F766E; --hero:#0F766E; --accent:#14B8A6; --nav-bg: rgba(255,255,255,0.92); }
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
html,body{height:100%;background:#F0FDFA;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start;background:var(--bg);}
.phone-shell{width:100%; max-width:430px; height:100dvh; background:var(--bg); position:relative; overflow:hidden; display:flex; flex-direction:column;}
@media(min-width:500px){ .phone-shell{ margin-top:12px; height:calc(100dvh - 24px); border-radius:28px; border:8px solid #111; box-shadow:0 25px 80px -20px rgba(0,0,0,.4); } }
.pageWrap{flex:1;position:relative;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;transition:opacity .15s;background:var(--bg)}
.page.active{opacity:1;pointer-events:auto;z-index:2}
.nav{height:68px; margin:8px; background:var(--nav-bg); backdrop-filter:blur(24px) saturate(200%); border:1.5px solid var(--card-border); border-radius:18px; display:flex;align-items:center;padding:5px;gap:4px;z-index:10; box-shadow: 0 10px 30px -12px rgba(0,0,0,.15);}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:var(--text-soft);font-size:10px;font-weight:700;cursor:pointer;transition:.15s}
.nav button.active{background:var(--hero);color:#fff;box-shadow:0 8px 18px rgba(15,118,110,.25)}
.nav button .icon{font-size:20px}
#fastSplash{position:fixed;inset:0;background:#F0FDFA;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
#fastSplash.hide{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
try{
  const saved=localStorage.getItem('omar_theme')||'teal';
  const themes={
    teal:{'--bg':'#F0FDFA','--bg-soft':'#CCFBF1','--card':'#FFFFFF','--card-border':'#5EEAD4','--text':'#134E4A','--text-soft':'#0D9488','--hero':'#0F766E','--accent':'#14B8A6','--nav-bg':'rgba(255,255,255,0.92)'},
    green:{'--bg':'#F0FDF4','--bg-soft':'#DCFCE7','--card':'#FFFFFF','--card-border':'#BBF7D0','--text':'#14532D','--text-soft':'#4ADE80','--hero':'#16A34A','--accent':'#22C55E','--nav-bg':'rgba(255,255,255,0.92)'}
  };
  const cur=themes[saved]||themes.teal;
  Object.entries(cur).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
}catch(e){}
</script>

<body>
<div id="fastSplash"><div style="width:36px;height:36px;border:3px solid #CCFBF1;border-top-color:#0F766E;border-radius:50%;animation:spin .7s linear infinite"></div></div>

<div class="phone-shell">
  <div class="pageWrap">
    <!-- افتراضي: اليومية - أخف صفحة -->
    <iframe data-page="daily.html" src="daily.html?v=15" class="page active" title="daily" loading="eager"></iframe>
    <iframe data-page="attendance.html" src="about:blank" class="page" title="attendance" loading="lazy"></iframe>
    <iframe data-page="tasks_final.html" src="about:blank" class="page" title="tasks" loading="lazy"></iframe>
    <!-- الرئيسية القديمة محفوظة بس مش بتتحمل أول مرة -->
    <iframe data-page="home.html" src="about:blank" class="page" title="home" loading="lazy"></iframe>
  </div>
  <nav class="nav">
    <button class="active" data-page="daily.html" onclick="switchPage('daily.html',this)"><span class="icon">📊</span><span>اليومية</span></button>
    <button data-page="attendance.html" onclick="switchPage('attendance.html',this)"><span class="icon">⏱️</span><span>الحضور</span></button>
    <button data-page="tasks_final.html" onclick="switchPage('tasks_final.html',this)"><span class="icon">✓</span><span>المهام</span></button>
  </nav>
</div>

<script src="drive-sync.js" defer></script>
<script>
const frames=document.querySelectorAll('.page');
let currentPage='daily.html';

function switchPage(name,btn,push=true){
  if(currentPage===name) return;
  currentPage=name;
  frames.forEach(f=>{
    const is=f.dataset.page===name;
    f.classList.toggle('active',is);
    if(is && f.src.includes('about:blank')){
      f.src=name+'?v=15';
      f.onload=()=>{
        try{
          const cur=localStorage.getItem('omar_theme')||'teal';
          if(f.contentWindow && f.contentWindow.applyTheme) f.contentWindow.applyTheme(cur,false);
        }catch(e){}
      };
    } else if(is){
      try{
        const cur=localStorage.getItem('omar_theme')||'teal';
        if(f.contentWindow && f.contentWindow.applyTheme) f.contentWindow.applyTheme(cur,false);
      }catch(e){}
    }
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(push){ try{ history.pushState({page:name}, '', '#'+name); }catch(e){} }
  if(navigator.vibrate) navigator.vibrate(10);
}

window.addEventListener('load', ()=>{
  setTimeout(()=>{
    const s=document.getElementById('fastSplash');
    if(s) s.classList.add('hide');
  }, 80);
});

window.addEventListener('load', ()=>{
  if('serviceWorker' in navigator){
    setTimeout(()=>{
      navigator.serviceWorker.register('./sw.js?v=15').then(()=>console.log('✅ PWA v15 Fast')).catch(()=>{});
    }, 800);
  }
});

try{
  history.replaceState({page:'daily.html'}, '', '#daily.html');
}catch(e){}

window.switchPage=switchPage;
// للوصول للرئيسية القديمة لو احتاجتها: switchPage('home.html')
window.openHome = ()=>{ 
  // هتفتح الرئيسية القديمة في نفس الفريم لو احتاجتها
  const homeFrame = document.querySelector('[data-page="home.html"]');
  if(homeFrame){
    homeFrame.src='home.html?v=15';
    switchPage('home.html', null);
  }
};
</script>
</body>
