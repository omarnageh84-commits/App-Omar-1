<script>
function applyTheme(t){}
window.syncToABOmar=function(){};
let defaultCats=[{id:1,emoji:'💊',name:'صيدلية'},{id:2,emoji:'💻',name:'شغل'},{id:3,emoji:'🏠',name:'شخصي'}];
let cats=[],tasks=[];
try{cats=JSON.parse(localStorage.getItem('cats_v5')||JSON.stringify(defaultCats));}catch(e){cats=defaultCats;}
try{tasks=JSON.parse(localStorage.getItem('tasks_v6')||'[]');}catch(e){tasks=[];}
tasks.forEach(t=>{if(!t.media)t.media=[];if(!t.innerTabs)t.innerTabs=[];if(!t.subtasks)t.subtasks=[];});
const themeColors=[["#70AD47","#5B9BD5","#FFC000","#A5A5A5","#ED7D31","#4472C4","#2F5597","#D9D9D9","#000000","#FFFFFF"],["#E2EFDA","#D6EAF8","#FFF2CC","#F2F2F2","#FCE4D6","#D9E2F3","#D6DCE4","#EDEDED","#808080","#F2F2F2"],["#C6E0B4","#BDD7EE","#FFE699","#D9D9D9","#F8CBAD","#B4C6E7","#ACB9CA","#BFBFBF","#595959","#D9D9D9"]];
const standardColors=["#7030A0","#002060","#0070C0","#00B0F0","#00B050","#92D050","#FFFF00","#FFC000","#FF0000","#C00000"];
let cur=null,selectedHex='#ffffff',activeTaskTab='all',curInnerTabId=null; if(activeTaskTab==='hidden'){ cur.hidden=true; }
let savedRangeNote=null,savedRangeInner=null;
function saveRange(editorId){
  let sel=window.getSelection();if(sel.rangeCount>0){
    let r=sel.getRangeAt(0);
    let ed=document.getElementById(editorId==='inner'?'innerTabEditor':'noteEditor');
    if(ed&&ed.contains(r.commonAncestorContainer)){
      if(editorId==='note')savedRangeNote=r.cloneRange();else savedRangeInner=r.cloneRange();
    }
  }
}
function restoreRange(editorId){
  let r=editorId==='note'?savedRangeNote:savedRangeInner;
  let id=editorId==='inner'?'innerTabEditor':'noteEditor';
  let ed=document.getElementById(id);
  if(r&&ed){let sel=window.getSelection();sel.removeAllRanges();try{sel.addRange(r);ed.focus();}catch(e){}}else if(ed)ed.focus();
}
document.addEventListener('selectionchange',()=>{
  let ae=document.activeElement;
  if(ae&&ae.id==='noteEditor')saveRange('note');
  if(ae&&ae.id==='innerTabEditor')saveRange('inner');
});

function exec(cmd,editor){restoreRange(editor);document.execCommand(cmd,false,null);saveRange(editor);if(editor==='note')autoSaveNote();else autoSaveInnerContent();}
function formatBlock(tag,editor){restoreRange(editor);document.execCommand('formatBlock',false,tag);saveRange(editor);if(editor==='note')autoSaveNote();else autoSaveInnerContent();}
function applyColor(c,editor){restoreRange(editor);document.execCommand('foreColor',false,c);saveRange(editor);if(editor==='note')autoSaveNote();else autoSaveInnerContent();}
function applyHighlight(c,editor){restoreRange(editor);document.execCommand('hiliteColor',false,c);saveRange(editor);if(editor==='note')autoSaveNote();else autoSaveInnerContent();}
function clearFormat(editor){restoreRange(editor);document.execCommand('removeFormat',false,null);document.execCommand('formatBlock',false,'p');saveRange(editor);if(editor==='note')autoSaveNote();else autoSaveInnerContent();}
function insertChecklist(editor){restoreRange(editor);let html=`<div class="checklist"><input type="checkbox"><span contenteditable="true">مهمة جديدة</span></div>`;document.execCommand('insertHTML',false,html);saveRange(editor);if(editor==='note')autoSaveNote();else autoSaveInnerContent();}
function updateWordCount(){let text=document.getElementById('noteEditor').innerText||'';let words=text.trim()?text.trim().split(/\s+/).length:0;let el=document.getElementById('editorWordCount');if(el)el.innerText=words+' كلمة';}

function saveLS(){try{localStorage.setItem('tasks_v6',JSON.stringify(tasks));localStorage.setItem('cats_v5',JSON.stringify(cats));if(window.syncToABOmar)syncToABOmar();}catch(e){}render();}

(function(){
  let inp=document.getElementById('mainInput');
  if(inp){
    inp.addEventListener('input', (e)=>{
      let v=e.target.value.trim();
      let code=localStorage.getItem('omar_hidden_code_v1') || '27943';
      if(v===code || v.startsWith(code+' ')){
        showHiddenTab=true;
        let chip=document.getElementById('tt_hidden');
        if(chip) chip.style.display='inline-block';
      }
    });
  }
})();

function render(){
  let board=document.getElementById('board');
  let filtered=tasks;
  if(activeTaskTab==='hidden'){
    filtered=tasks.filter(t=>t.hidden);
  }else if(activeTaskTab==='done'){
    filtered=tasks.filter(t=>t.done && !t.hidden);
  }else if(activeTaskTab!=='all'){
    filtered=tasks.filter(t=>t.cat===activeTaskTab && !t.hidden);
  }else{
    filtered=tasks.filter(t=>!t.hidden);
  }
  let code=localStorage.getItem('omar_hidden_code_v1') || '27943';
  let hiddenSettingsHtml='';
  if(activeTaskTab==='hidden'){
    hiddenSettingsHtml=`<div style="background:var(--card);border:1.5px solid var(--hero);border-radius:12px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:10px">🔒 وضع المخفي - أي مهمة تضيفها هنا هتكون مخفية</b><button onclick="exitHidden()" style="background:var(--bg-soft);border:1px solid var(--card-border);border-radius:6px;padding:3px 8px;font-size:8px;font-weight:800">✕ إغلاق المخفي</button></div>
      <div style="background:var(--bg-soft);border-radius:8px;padding:8px">
        <div style="font-size:8px;font-weight:800;color:var(--text);margin-bottom:4px">تغيير الكود السري (مخفي عن العامة)</div>
        <div style="display:flex;gap:6px"><input id="hiddenCodeInput" type="password" placeholder="الكود الحالي مخفي" style="flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:6px;font-size:10px"><button onclick="toggleCodeVisibility()" style="background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:6px 8px;font-size:10px">👁️</button><button onclick="saveHiddenCode()" style="background:var(--hero);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:9px;font-weight:800">حفظ</button></div>
        <div style="font-size:7px;color:var(--text-soft);margin-top:4px">الكود الحالي: <span id="currentHiddenCodeDisplay">••••</span> <button onclick="showCurrentCode()" style="background:transparent;border:none;font-size:7px;color:var(--hero);text-decoration:underline;cursor:pointer">إظهار 5 ثواني</button></div>
      </div>
    </div>`;
  }
  if(filtered.length===0){
    let msg = activeTaskTab==='hidden' ? '🔒 لا يوجد مهام مخفية<br><small style="font-size:8px">اكتب أي اسم فوق أو من + وهيتضاف مخفي تلقائياً لأنك جوه المخفي</small>' : '📭 لا يوجد مهام';
    board.innerHTML=hiddenSettingsHtml+'<div style="text-align:center;padding:30px;color:var(--text-soft)">'+msg+'</div>';
    return;
  }
  let cardsHtml=filtered.map(t=>{
    let total=(t.subtasks||[]).length;
    let done=(t.subtasks||[]).filter(s=>s.done).length;
    let pct= total>0 ? Math.round((done/total)*100) : 0;
    let progressDiv = (total>0 && pct>0) ? `<div class="task-progress-full" style="width:${pct}%;background:color-mix(in srgb, var(--hero) 18%, var(--card));border-right:3px solid var(--hero)"></div>` : '';
    let pctBadge = total>0 ? `<span style="font-size:7px;font-weight:900;background:var(--hero);color:#fff;padding:1px 5px;border-radius:99px;margin-right:4px">${pct}%</span>` : '';
    return `<div class="task-outer"><div class="task-card ${t.done?'done':''}" style="border-right:4px solid ${t.color||'#bbf7d0'}" onclick="openTask(${t.id})">${progressDiv}<div class="task-card-content" style="display:flex;gap:8px;align-items:center;flex:1"><input type="checkbox" ${t.done?'checked':''} onclick="event.stopPropagation();toggleDoneQuick(${t.id})" style="width:18px;height:18px"><div style="flex:1"><div style="font-size:11px;font-weight:800">${t.hidden?'🔒 ':''}${t.text||'بدون عنوان'} ${pctBadge}</div><div style="font-size:8px;color:var(--text-soft);margin-top:2px">${t.cat||''} ${total? '• '+done+'/'+total:''} ${t.media?.length? '• 📸'+t.media.length:''}</div></div></div></div><button class="ext-del" onclick="quickDelete(${t.id})" style="position:relative;z-index:2">🗑</button></div>`;
  }).join('');
  board.innerHTML=hiddenSettingsHtml+cardsHtml;
  let chipBox=document.getElementById('dynamicCatsChips');
  if(chipBox) chipBox.innerHTML=cats.map(c=>`<button onclick="filterTasksTab('${c.name}')" id="tt_${c.name}" class="filter-chip ${activeTaskTab===c.name?'active':''}">${c.emoji} ${c.name}</button>`).join('');
  let hiddenChip=document.getElementById('tt_hidden');
  if(hiddenChip) hiddenChip.style.display = showHiddenTab ? 'inline-block' : 'none';
}
function exitHidden(){
  filterTasksTab('all');
  // إخفاء التبويب مرة أخرى بعد الخروج - زي ما طلبت
  showHiddenTab=false;
  let chip=document.getElementById('tt_hidden');
  if(chip) chip.style.display='none';
  // امسح الكود من خانة البحث لو موجود
  let inp=document.getElementById('mainInput');
  if(inp){
    let code=localStorage.getItem('omar_hidden_code_v1') || '27943';
    if(inp.value.trim()===code) inp.value='';
  }
}

function quickDelete(id){let t=tasks.find(x=>x.id===id);if(!t)return;cur=t;document.getElementById('delTaskPreview').innerText=t.text;document.getElementById('delConfirmCheck').checked=false;document.getElementById('finalDelBtn').disabled=true;document.getElementById('deleteWarningModal').classList.add('show');}
function toggleDelBtn(){let chk=document.getElementById('delConfirmCheck').checked;let btn=document.getElementById('finalDelBtn');btn.disabled=!chk;btn.style.background=chk?'#ef4444':'#E5E7EB';btn.style.color=chk?'#fff':'#9CA3AF';}
function closeDeleteWarning(){document.getElementById('deleteWarningModal').classList.remove('show');}
function confirmDelete(){if(!cur)return;let delId=cur.id;cur=null;document.getElementById('modal').style.display='none';closeDeleteWarning();tasks=tasks.filter(x=>x.id!==delId);saveLS();}
let showHiddenTab=false;
function filterTasksTab(tab){
  activeTaskTab=tab;
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  let el=document.getElementById('tt_'+tab);
  if(el) el.classList.add('active');
  // لو خرجت من المخفي لتبويب تاني، اخفيه تلقائياً
  if(tab!=='hidden' && showHiddenTab){
    // لا تخفي فوراً، استنى شوية عشان لو راجع، لكن حسب طلبك هنخفيه لما تخرج
    // showHiddenTab يفضل true لحد ما تدوس خروج، لكن هنسيبه يختفي لما تدوس أي تبويب تاني
    // هنخفيه فعلاً
    showHiddenTab=false;
    let chip=document.getElementById('tt_hidden');
    if(chip) chip.style.display='none';
  }
  render();
}
function addQuick(){let text=document.getElementById('mainInput').value.trim();if(!text){openNewTaskModal();return;}doAdd();}
function doAdd(){
  let inp=document.getElementById('mainInput');
  let raw=inp.value.trim();
  if(!raw){ openNewTaskModal(); return; }
  let code=localStorage.getItem('omar_hidden_code_v1') || '27943';
  if(raw===code){
    showHiddenTab=true;
    let chip=document.getElementById('tt_hidden');
    if(chip) chip.style.display='inline-block';
    filterTasksTab('hidden');
    inp.value='';
    return;
  }
  let isHidden=false;
  let text=raw;
  // لو انت جوه المخفي، أي حاجة تكتبها تتضاف مخفية تلقائياً
  if(activeTaskTab==='hidden'){
    isHidden=true;
    // لو كتبت الكود + مسافة، شيل الكود
    if(raw.startsWith(code+' ') || raw.startsWith(code+'-')){
      text=raw.substring(code.length+1).trim() || 'مهمة مخفية';
    }
  }else{
    if(raw.startsWith(code+' ') || raw.startsWith(code+'-')){
      isHidden=true;
      text=raw.substring(code.length+1).trim() || 'مهمة مخفية';
    }
  }
  let catSel=document.getElementById('cat').value;
  tasks.unshift({id:Date.now(),text:text,cat:catSel,color:selectedHex||'#ffffff',done:false,note:'',subtasks:[],innerTabs:[],media:[],hidden:isHidden});
  inp.value='';
  saveLS();
  if(isHidden){
    showHiddenTab=true;
    let chip=document.getElementById('tt_hidden');
    if(chip) chip.style.display='inline-block';
    filterTasksTab('hidden');
  }
}
function ensureInTasks(){if(!cur)return;let ex=tasks.find(x=>x.id===cur.id);if(!ex)tasks.unshift(cur);}
function switchPane(p){document.querySelectorAll('.pro-seg-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.pane').forEach(el=>el.classList.remove('active'));document.getElementById('pane'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');document.getElementById('seg'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');}
function openNewTaskModal(){cur={id:Date.now(),text:'',cat:cats[0]?.name||'شخصي',color:'#ffffff',done:false,note:'',subtasks:[],innerTabs:[],media:[]};document.getElementById('modalTitle').value='';document.getElementById('noteEditor').innerHTML='';document.getElementById('modalCover').style.setProperty('--hero-color',cur.color);document.getElementById('currentColorPreview').style.background=cur.color;document.getElementById('modalCat').innerHTML=cats.map(c=>`<option value="${c.name}" ${c.name===cur.cat?'selected':''}>${c.emoji} ${c.name}</option>`).join('');renderSubtasks();renderInnerTabs();renderMedia();switchPane('sub');document.getElementById('modal').style.display='flex';}
function openTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;if(!t.media)t.media=[];cur=t;document.getElementById('modalTitle').value=t.text||'';document.getElementById('modalCover').style.setProperty('--hero-color',t.color||'#16a34a');document.getElementById('currentColorPreview').style.background=t.color||'#fff';document.getElementById('noteEditor').innerHTML=t.note||'';document.getElementById('modalCat').innerHTML=cats.map(c=>`<option value="${c.name}" ${c.name===t.cat?'selected':''}>${c.emoji} ${c.name}</option>`).join('');renderSubtasks();renderInnerTabs();renderMedia();updateWordCount();switchPane('sub');document.getElementById('modal').style.display='flex';}
function closeModal(){if(cur){cur.text=document.getElementById('modalTitle').value.trim()||cur.text;ensureInTasks();saveLS();}document.getElementById('modal').style.display='none';cur=null;curInnerTabId=null; if(activeTaskTab==='hidden'){ cur.hidden=true; }stopCamera();stopVoice();}
function changeModalCat(){if(cur){cur.cat=document.getElementById('modalCat').value;ensureInTasks();saveLS();}}
function toggleDoneQuick(id){let t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;saveLS();}}
function deleteCurrent(){if(!cur)return;quickDelete(cur.id);}

let cameraStream=null;
async function openCamera(){document.getElementById('cameraModal').classList.add('show');try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});document.getElementById('cameraVideo').srcObject=cameraStream;}catch(e){alert('مش قادر أفتح الكاميرا: '+e.message);closeCamera();}}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}document.getElementById('cameraVideo').srcObject=null;}
function closeCamera(){document.getElementById('cameraModal').classList.remove('show');stopCamera();}
function capturePhoto(){let video=document.getElementById('cameraVideo');let canvas=document.getElementById('cameraCanvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);let dataUrl=canvas.toDataURL('image/jpeg',0.8);if(!cur.media)cur.media=[];cur.media.push({id:Date.now(),name:'كاميرا '+new Date().toLocaleTimeString(),type:'image/jpeg',data:dataUrl,isImage:true,isVideo:false,isAudio:false,isLink:false});renderMedia();ensureInTasks();saveLS();closeCamera();switchPane('media');}
function handleGallery(e){let files=e.target.files;if(!files||!cur)return;if(!cur.media)cur.media=[];Array.from(files).forEach(file=>{let reader=new FileReader();reader.onload=ev=>{cur.media.push({id:Date.now()+Math.random(),name:file.name,type:file.type,data:ev.target.result,isImage:true,isVideo:false,isAudio:false,isLink:false});renderMedia();ensureInTasks();saveLS();};reader.readAsDataURL(file);});e.target.value='';switchPane('media');}
let mediaRecorder=null,audioChunks=[],voiceStartTime=null,voiceTimerInterval=null,isRecording=false;
async function openVoice(){document.getElementById('voiceModal').classList.add('show');document.getElementById('voiceTimer').innerText='00:00';document.getElementById('voiceWave').style.opacity='.3';}
function closeVoice(){document.getElementById('voiceModal').classList.remove('show');stopVoice();}
function stopVoice(){if(mediaRecorder&&isRecording){mediaRecorder.stop();}isRecording=false;clearInterval(voiceTimerInterval);mediaRecorder=null;let btn=document.getElementById('voiceActionBtn');if(btn){btn.innerText='● بدء التسجيل';btn.style.background='#ef4444';}document.getElementById('voiceWave').style.opacity='.3';}
async function toggleVoiceRecord(){let btn=document.getElementById('voiceActionBtn');if(!isRecording){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let reader=new FileReader();reader.onload=ev=>{if(!cur.media)cur.media=[];cur.media.push({id:Date.now(),name:'تسجيل '+new Date().toLocaleTimeString(),type:'audio/webm',data:ev.target.result,isImage:false,isVideo:false,isAudio:true,isLink:false});renderMedia();ensureInTasks();saveLS();switchPane('media');};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop());};mediaRecorder.start();isRecording=true;voiceStartTime=Date.now();btn.innerText='■ إيقاف وحفظ';btn.style.background='#14532d';document.getElementById('voiceWave').style.opacity='1';voiceTimerInterval=setInterval(()=>{let diff=Math.floor((Date.now()-voiceStartTime)/1000);let m=String(Math.floor(diff/60)).padStart(2,'0');let s=String(diff%60).padStart(2,'0');document.getElementById('voiceTimer').innerText=m+':'+s;},500);}catch(e){alert('الميكروفون مش متاح: '+e.message);}}else{mediaRecorder.stop();closeVoice();}}
function renderMedia(){if(!cur)return;let list=cur.media||[];document.getElementById('mediaCount').innerText=list.length;let container=document.getElementById('mediaList');let empty=document.getElementById('emptyMedia');if(list.length===0){container.innerHTML='';empty.style.display='block';return;}empty.style.display='none';container.innerHTML=list.map(m=>{if(m.isImage){return `<div class="media-item"><img src="${m.data}"><button class="media-del" onclick="delMedia(${m.id})">✕</button></div>`;}else if(m.isAudio){return `<div class="audio-item"><div style="width:36px;height:36px;background:#fee2e2;color:#dc2626;border-radius:8px;display:flex;align-items:center;justify-content:center">🎙️</div><audio controls src="${m.data}" style="flex:1;height:32px"></audio><button onclick="delMedia(${m.id})" style="border:none;background:#FFF1F2;color:#ef4444;width:28px;height:28px;border-radius:8px">✕</button></div>`;}else{return `<div class="media-item"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-soft)">📄 ${m.name}</div><button class="media-del" onclick="delMedia(${m.id})">✕</button></div>`;}}).join('');}
function delMedia(id){if(!cur||!cur.media)return;cur.media=cur.media.filter(x=>x.id!==id);renderMedia();saveLS();}

function showToast(title, sub='', type='success'){
  let cont=document.getElementById('toastContainer');
  if(!cont){
    cont=document.createElement('div');
    cont.id='toastContainer';
    document.body.appendChild(cont);
  }
  let t=document.createElement('div');
  t.className='toast-pro '+type;
  t.innerHTML=`<div class="toast-pro-icon">${type==='success'?'✅':'⚠️'}</div><div class="toast-pro-text"><div class="toast-pro-title">${title}</div>${sub?`<div class="toast-pro-sub">${sub}</div>`:''}</div><button onclick="this.parentElement.remove()" style="background:transparent;border:none;font-size:12px;cursor:pointer;color:var(--text-soft)">✕</button>`;
  cont.appendChild(t);
  setTimeout(()=>{
    t.style.animation='toastOut .3s ease forwards';
    setTimeout(()=>{ t.remove(); }, 300);
  }, 3000);
}
// Override alert to use toast for professional look
window._oldAlert = window.alert;
window.alert = function(msg){
  // Parse if it's code save message
  if(typeof msg==='string' && msg.includes('تم حفظ')){
    showToast(msg, '', 'success');
  }else if(typeof msg==='string' && msg.toLowerCase().includes('قصير')){
    showToast('الكود قصير جداً', 'اكتب 3 أحرف على الأقل', 'error');
  }else{
    showToast(msg, '', 'success');
  }
};

function saveHiddenCode(){
  let inp=document.getElementById('hiddenCodeInput');
  if(!inp) return;
  let v=inp.value.trim();
  if(!v) return;
  if(v.length<3){ showToast('الكود قصير جداً','اكتب 3 أحرف على الأقل','error'); return; }
  localStorage.setItem('omar_hidden_code_v1', v);
  showToast('تم حفظ الكود الجديد','الكود: '+v+' - استخدم: '+v+' + مسافة + اسم المهمة','success');
  inp.value='';
  render();
}
function toggleCodeVisibility(){
  let inp=document.getElementById('hiddenCodeInput');
  if(!inp) return;
  inp.type = inp.type==='password' ? 'text' : 'password';
}
function showCurrentCode(){
  let code=localStorage.getItem('omar_hidden_code_v1') || '27943';
  let el=document.getElementById('currentHiddenCodeDisplay');
  if(el){
    if(el.innerText==='••••'){
      el.innerText=code;
      setTimeout(()=>{ el.innerText='••••'; }, 5000);
    }else{
      el.innerText='••••';
    }
  }
}

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
