<script>

// themes.js - AB Omar - Themes + Core Missing Functions Fix
// هذا الملف يوفر الثيمات + الدوال الناقصة اللي كانت بتسبب ReferenceError
// بدون ما نعدل أي حرف في daily.html

const themes = {
  light: {
    '--bg': '#f8fafc',
    '--bg-soft': '#f1f5f9',
    '--card': '#ffffff',
    '--card-border': '#e2e8f0',
    '--text': '#0f172a',
    '--text-soft': '#64748b',
    '--hero': '#0f766e'
  },
  dark: {
    '--bg': '#0f172a',
    '--bg-soft': '#1e293b',
    '--card': '#1e293b',
    '--card-border': '#334155',
    '--text': '#f1f5f9',
    '--text-soft': '#94a3b8',
    '--hero': '#14b8a6'
  }
};

function applyTheme(name){
  let t = themes[name] || themes.light;
  Object.entries(t).forEach(([k,v])=>{
    document.documentElement.style.setProperty(k,v);
  });
  localStorage.setItem('omar_theme', name);
}

(function(){
  let saved = localStorage.getItem('omar_theme') || 'light';
  try{ applyTheme(saved); }catch(e){}
})();

window.toggleTheme = function(){
  let cur = localStorage.getItem('omar_theme') || 'light';
  applyTheme(cur==='light'?'dark':'light');
};

// ===== Core functions that were missing and caused ReferenceError =====
// نعرفهم فقط لو مش موجودين في daily.html عشان منغيرش حاجة


if(typeof dayFilter === 'undefined'){
  var dayFilter = {expense:'month', income:'month', debt:'month', amanat:'month'};
}

if(typeof setDayFilter === 'undefined'){
function setDayFilter(type,mode){const prefix=type==='expense'?'exp':type==='income'?'inc':type==='amanat'?'ama':'debt';const fromEl=document.getElementById(`f-${prefix}-from`);const toEl=document.getElementById(`f-${prefix}-to`);const today=new Date().toISOString().slice(0,10);if(mode==='today'){fromEl.value=today;toEl.value=today}else if(mode==='month'){const{first,last}=getMonthRange(curYM);fromEl.value=first;toEl.value=last}else if(mode==='all'){fromEl.value='';toEl.value=''}if(type==='debt')renderDebt();else if(type==='total')renderTotal();else renderSimple(type)}
}

if(typeof renderSimple === 'undefined'){
function renderSimple(type){
  try{
    let containerId = type==='expense'?'t-expense': type==='income'?'t-income': type==='amanat'?'t-amanat':'t-'+type;
    let el = document.getElementById(containerId);
    if(!el){ console.warn('container not found', containerId); return; }
    // filters
    let q='', w='', from='', to='';
    if(type==='expense'){
      q=(document.getElementById('f-exp-q')?.value||'').toLowerCase();
      w=document.getElementById('f-exp-w')?.value||'';
      from=document.getElementById('f-exp-from')?.value||'';
      to=document.getElementById('f-exp-to')?.value||'';
    }else if(type==='income'){
      q=(document.getElementById('f-inc-q')?.value||'').toLowerCase();
      from=document.getElementById('f-inc-from')?.value||'';
      to=document.getElementById('f-inc-to')?.value||'';
    }else if(type==='amanat'){
      q=(document.getElementById('f-ama-q')?.value||'').toLowerCase();
      from=document.getElementById('f-ama-from')?.value||'';
      to=document.getElementById('f-ama-to')?.value||'';
    }
    let list = transactions.filter(t=>{
      if(t.type!==type) return false;
      if(q){
        let hay=[t.item||'', t.person||'', t.note||'', t.wallet||''].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(w && t.wallet!==w) return false;
      if(from && t.date < from) return false;
      if(to && t.date > to) return false;
      if(dayFilter[type]==='month'){
        if(!t.date || !t.date.startsWith(curYM)) return false;
      }
      // global search
      if(globalSearchQuery){
        let hay2=[t.item||'', t.person||'', t.wallet||'', t.note||'', t.amount||'', t.date||''].join(' ').toLowerCase();
        if(!hay2.includes(globalSearchQuery)) return false;
      }
      return true;
    });
    list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    if(!list.length){
      el.innerHTML=`<div style="padding:20px;text-align:center;color:var(--text-soft);background:var(--card);border:1.5px dashed var(--card-border);border-radius:12px;margin:8px 0;font-weight:900">فاضي - مفيش بيانات للشهر ده</div>`;
      return;
    }
    let total = list.reduce((s,x)=>s+(Number(x.amount)||0),0);
    let html=`<div class="tsec"><div class="thead"><b>${type==='expense'?'المصروفات':type==='income'?'الدخل':'الأمانات'} (${list.length})</b><span style="background:var(--hero);color:#fff;padding:2px 8px;border-radius:20px;font-size:10px">${total.toLocaleString()} ج</span></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>بند</th><th>محفظة</th><th>مبلغ</th><th></th></tr></thead><tbody>`;
    list.forEach(t=>{
      let safeId = (t.id||'').replace(/'/g,"\'");
      html+=`<tr onclick="openEdit('${safeId}')" style="cursor:pointer"><td>${t.date||''}</td><td>${(t.item||t.person||'')}</td><td>${t.wallet||''}</td><td style="color:${type==='income'?'#16a34a':'#ef4444'};font-weight:900">${Number(t.amount).toLocaleString()}</td><td>✏️</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
    el.innerHTML=html;
  }catch(e){ console.error('renderSimple error', e); }
}
}

if(typeof renderDebt === 'undefined'){
function renderDebt(){
  try{
    let q=(document.getElementById('f-debt-q')?.value||'').toLowerCase();
    let from=document.getElementById('f-debt-from')?.value||'';
    let to=document.getElementById('f-debt-to')?.value||'';
    let filterBy = (t)=>{
      if(t.type!=='debt') return false;
      if(q){
        let hay=[t.person||'', t.item||'', t.note||''].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(from && t.date < from) return false;
      if(to && t.date > to) return false;
      if(dayFilter['debt']==='month'){
        if(!t.date || !t.date.startsWith(curYM)) return false;
      }
      if(globalSearchQuery){
        let hay2=[t.person||'', t.item||'', t.wallet||'', t.note||''].join(' ').toLowerCase();
        if(!hay2.includes(globalSearchQuery)) return false;
      }
      return true;
    };
    let dueList = transactions.filter(t=>filterBy(t) && (t.subType==='debt_due' || t.status==='due'));
    let defList = transactions.filter(t=>filterBy(t) && (t.subType==='debt_def' || t.status==='def'));
    dueList.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    defList.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    let renderList = (list)=>{
      if(!list.length) return `<div style="padding:20px;text-align:center;color:var(--text-soft);background:var(--card);border:1.5px dashed var(--card-border);border-radius:12px;margin:8px 0;font-weight:900">فاضي - مفيش بيانات للشهر ده</div>`;
      let tot=list.reduce((s,x)=>s+(Number(x.amount)||0),0);
      let html=`<div class="tsec"><div class="thead"><b>الإجمالي ${list.length}</b><span style="background:var(--hero);color:#fff;padding:2px 8px;border-radius:20px;font-size:10px">${tot.toLocaleString()} ج</span></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>شخص</th><th>اتجاه</th><th>مبلغ</th><th>حالة</th></tr></thead><tbody>`;
      list.forEach(t=>{
        let safeId=(t.id||'').replace(/'/g,"\'");
        html+=`<tr onclick="openEdit('${safeId}')" style="cursor:pointer"><td>${t.date||''}</td><td>${t.person||''}</td><td>${t.direction||''}</td><td>${Number(t.amount).toLocaleString()}</td><td>${t.status||''}</td></tr>`;
      });
      html+=`</tbody></table></div></div>`;
      return html;
    };
    let dueEl=document.getElementById('debt-due');
    let defEl=document.getElementById('debt-def');
    if(dueEl) dueEl.innerHTML=renderList(dueList);
    if(defEl) defEl.innerHTML=renderList(defList);
  }catch(e){ console.error('renderDebt error', e); }
}
}

// Override renderStats to include fixed expenses
function renderStats(type){
const allMonth=transactions.filter(t=>t.date&&t.date.startsWith(curYM));
const monthList=allMonth.filter(t=>{if(t.excludeFromBalance)return false;const isDef=t.subType==='debt_def'||t.status==='def';if(isDef&&!includeDeferredInBalance)return false;return true});
const incomeMonth=monthList.filter(t=>t.type==='income').reduce((s,x)=>s+Number(x.amount),0);
let expenseMonth=monthList.filter(t=>t.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
let fixedSum=getFixedForMonth(curYM).reduce((a,b)=>a+(Number(b.amount)||0),0);
expenseMonth+=fixedSum;
let dueO=0,dueL=0;monthList.filter(t=>t.type==='debt'&&(t.subType==='debt_due'||t.status==='due')).forEach(t=>{if(t.direction==='عليا')dueO+=Number(t.amount);else dueL+=Number(t.amount)});
const debtDueNet=dueL-dueO;
let defOAll=0,defLAll=0;allMonth.filter(t=>t.type==='debt'&&(t.subType==='debt_def'||t.status==='def')).forEach(t=>{if(t.direction==='عليا')defOAll+=Number(t.amount);else defLAll+=Number(t.amount)});
const debtDefNetAll=defLAll-defOAll;
const isActive=includeDeferredInBalance;
const netThere = incomeMonth - expenseMonth - dueO + dueL + (isActive ? debtDefNetAll : 0);
const top5=`<div class="kpi-grid-5">
<div class="stat pos"><small>إجمالي الدخل</small><b>${incomeMonth.toLocaleString()}</b></div>
<div class="stat neg"><small>إجمالي المصروف</small><b>${expenseMonth.toLocaleString()}</b></div>
<div class="stat neg"><small>إجمالي المستحقة</small><b>${(dueO - dueL).toLocaleString()}</b></div>
<div class="stat neu"><small>الصافي هناك</small><b>${netThere.toLocaleString()}</b></div>
<div class="stat def ${isActive?'active':'inactive'}" onclick="toggleDeferredInclude()"><span style="font-size:5px;background:${isActive?'#dcfce7':'#fee2e2'};color:${isActive?'#16a34a':'#ef4444'};padding:1px 4px;border-radius:10px">${isActive?'✅ مفعلة':'❌ مخفية'}</span><small>المؤجلة ⏳</small><b>${debtDefNetAll.toLocaleString()}</b></div>
</div>`;
document.querySelectorAll('[id^="stats-"]').forEach(el=>{
if(el.id==='stats-debt'){
  let oDue=0,lDue=0,oDef=0,lDef=0;
  allMonth.filter(t=>t.type==='debt').forEach(t=>{
    if(t.subType==='debt_due'||t.status==='due'){
      if(!t.excludeFromBalance){if(t.direction==='عليا')oDue+=Number(t.amount);else lDue+=Number(t.amount)}
    }else{
      if(t.direction==='عليا')oDef+=Number(t.amount);else lDef+=Number(t.amount)
    }
  });
  if(curDebtSub==='due'){
    el.innerHTML=`<div class="kpi-grid-5" style="grid-template-columns:repeat(3,1fr)!important">
<div class="stat neg"><small>إجمالي عليا مستحق</small><b>${oDue.toLocaleString()}</b></div>
<div class="stat pos"><small>إجمالي ليا مستحق</small><b>${lDue.toLocaleString()}</b></div>
<div class="stat neu"><small>صافي المستحق</small><b>${(lDue-oDue).toLocaleString()}</b></div>
</div>`;
  }else{
    el.innerHTML=`<div class="kpi-grid-5" style="grid-template-columns:repeat(3,1fr)!important">
<div class="stat neg"><small>عليا مؤجل</small><b>${oDef.toLocaleString()}</b></div>
<div class="stat pos"><small>ليا مؤجل</small><b>${lDef.toLocaleString()}</b></div>
<div class="stat neu"><small>صافي المؤجل</small><b>${(lDef-oDef).toLocaleString()}</b></div>
</div>`;
  }
  return;
}
if(el.id==='stats-amanat'){
  let dep=0,wd=0;
  allMonth.filter(t=>t.type==='amanat').forEach(t=>{
    let amt=Number(t.amount)||0;
    if((t.direction||'إيداع')==='سحب' || t.amanatType==='سحب') wd+=amt; else dep+=amt;
  });
  el.innerHTML=`<div class="kpi-grid-5" style="grid-template-columns:repeat(3,1fr)!important">
<div class="stat pos"><small>إجمالي الإيداع</small><b>${dep.toLocaleString()}</b></div>
<div class="stat neg"><small>إجمالي السحب</small><b>${wd.toLocaleString()}</b></div>
<div class="stat neu"><small>الصافي</small><b>${(dep-wd).toLocaleString()}</b></div>
</div>`;
  return;
}
el.innerHTML=top5;
});
}

// Fix refreshCurrent to include fixed section - patch it
(function(){
  if(typeof refreshCurrent !== 'undefined'){
    let _origRefresh = refreshCurrent;
    window.refreshCurrent = function(){
      try{
        if(typeof curTab !== 'undefined' && curTab==='expense'){
          try{ if(typeof renderFixedSection === 'function') renderFixedSection(); }catch(e){}
        }
        _origRefresh();
      }catch(e){
        console.error('refreshCurrent patched error', e);
        try{ _origRefresh(); }catch(e2){}
      }
    };
  }
})();

console.log('✅ Themes + Core Fixes loaded - renderSimple/renderDebt fixed');

</script>

<script>
// drive-sync.js - AB Omar V10 - JSON ONLY - Single File
// يكتب في ملف واحد فقط: Omar Backup.json - ID: 1d-SvP_ldsgF1GiM6R9HbDN1MX431JzDr
// Apps Script: https://script.google.com/macros/s/AKfycbyV8WQb8MIN3Dxfc7IBBXIYjgza-xFq6p_ujvu66z_95mcfvr4t5ZpAXRzAZbdkCDgC/exec

const DRIVE_CONFIG = {
  FILE_ID: '1d-SvP_ldsgF1GiM6R9HbDN1MX431JzDr',
  FILE_NAME: 'Omar Backup.json',
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyV8WQb8MIN3Dxfc7IBBXIYjgza-xFq6p_ujvu66z_95mcfvr4t5ZpAXRzAZbdkCDgC/exec',
  DEBOUNCE: 1500
};

let _lastDataHash = '';
let _debounceTimer = null;
let _isSyncing = false;

function getAllData(){
  try{
    return {
      tx: localStorage.getItem('omar_tx_v3'),
      bands: localStorage.getItem('omar_master_bands'),
      fixed_templates: localStorage.getItem('omar_fixed_templates'),
      fixed_by_month: localStorage.getItem('omar_fixed_by_month'),
      wallets: localStorage.getItem('omar_wallets_v3'),
      include_def: localStorage.getItem('omar_include_def'),
      ts: new Date().toISOString()
    };
  }catch(e){ return null; }
}

function hashData(d){
  try{ return JSON.stringify(d).length + '_' + (d.tx ? d.tx.length : 0); }catch(e){ return ''; }
}

window.syncToABOmar = function(){
  if(_debounceTimer) clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(async ()=>{
    if(_isSyncing) return;
    let data = getAllData();
    if(!data) return;
    let h = hashData(data);
    if(h === _lastDataHash) return;
    _lastDataHash = h;
    
    _isSyncing = true;
    try{
      console.log('🔄 Syncing to Drive JSON Only...', new Date().toLocaleTimeString());
      
      if(DRIVE_CONFIG.APPS_SCRIPT_URL){
        await fetch(DRIVE_CONFIG.APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({
            action: 'backup',
            fileId: DRIVE_CONFIG.FILE_ID,
            data: data,
            source: 'daily.html'
          })
        }).catch(e=>{});
      }
      
      try{
        localStorage.setItem('omar_last_sync', new Date().toISOString());
      }catch(e){}
      
      console.log('✅ AB Omar JSON Backup V10 - Single File Ready - Omar Backup.json');
      
    }catch(e){
      console.warn('Sync error:', e);
    }finally{
      _isSyncing = false;
    }
  }, DRIVE_CONFIG.DEBOUNCE);
};

window.addEventListener('omar_data_updated', ()=>{ window.syncToABOmar(); });
window.addEventListener('storage', (e)=>{ if(e.key && e.key.startsWith('omar_')) window.syncToABOmar(); });

setTimeout(()=>{ _lastDataHash=''; window.syncToABOmar(); }, 3000);

console.log('✅ Drive Sync V10 Loaded - JSON Only - File:', DRIVE_CONFIG.FILE_NAME);

</script>

<script>
function safeParse(k,f){try{let v=localStorage.getItem(k);if(!v||v==='undefined'||v==='null')return f;let p=JSON.parse(v);return p==null?f:p;}catch(e){try{localStorage.removeItem(k);}catch(e2){}return f;}}
function toast(m,t='ok'){let b=document.getElementById('toastBox');if(!b){b=document.createElement('div');b.id='toastBox';b.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:20000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';document.body.appendChild(b);}let el=document.createElement('div');el.className='toast '+(t==='ok'?'ok':'err');el.style.cssText='display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:240px;max-width:340px;pointer-events:auto;';el.innerHTML=`<span>${t==='ok'?'✅':'⚠️'}</span><span style="font-size:10px;font-weight:800;flex:1">${m}</span><button onclick="this.parentElement.remove()" style="background:transparent;border:none">✕</button>`;b.appendChild(el);setTimeout(()=>{try{el.remove();}catch(e){}},3000);}
let transactions=safeParse('omar_tx_v3', []);
let masterBands=safeParse('omar_master_bands', []);
let includeDeferredInBalance=safeParse('omar_include_def', false);
let wallets=safeParse('omar_wallets_v3', ["كاش","محفظة بنكية","فودافون كاش","الخزنة","الأمانات"]);
let curTab='expense',curDebtSub='due',editingId=null,cardTab='expense';
let excludeFromBalanceCurrent=false;
let currentBand=null,currentSection=null,promptCallback=null;
let curYM = new Date().toISOString().slice(0,7);
let defaultFixed12=[
  {"id":"1","name":"الإيجار","def":5000},
  {"id":"2","name":"الكهرباء","def":400},
  {"id":"3","name":"مياه","def":200},
  {"id":"4","name":"غاز","def":150},
  {"id":"5","name":"إنترنت","def":300},
  {"id":"6","name":"","def":0},
  {"id":"7","name":"","def":0},
  {"id":"8","name":"","def":0},
  {"id":"9","name":"","def":0},
  {"id":"10","name":"","def":0},
  {"id":"11","name":"","def":0},
  {"id":"12","name":"","def":0}
];
let fixedTemplates=safeParse('omar_fixed_templates', defaultFixed12);
// ترحيل: لو اللي متخزن أقل من 12 كمله لـ 12
if(!fixedTemplates || !Array.isArray(fixedTemplates) || fixedTemplates.length<12){
  let existing = Array.isArray(fixedTemplates) ? fixedTemplates : [];
  let usedIds = new Set(existing.map(x=>x.id));
  let merged = [...existing];
  for(let i=0;i<defaultFixed12.length && merged.length<12;i++){
    if(!usedIds.has(defaultFixed12[i].id)){
      // لو الاسم فاضي ممكن نسيبه
      if(defaultFixed12[i].name==='' && merged.length>=5) {
        merged.push({id:(100+i).toString(), name:'', def:0});
      } else if(defaultFixed12[i].name!=='') {
        if(!merged.find(x=>x.name===defaultFixed12[i].name)) merged.push(defaultFixed12[i]);
      }
    }
  }
  while(merged.length<12){
    merged.push({id:'f_'+Date.now()+'_'+merged.length, name:'', def:0});
  }
  fixedTemplates=merged.slice(0,12);
  localStorage.setItem('omar_fixed_templates',JSON.stringify(fixedTemplates));
}
let fixedByMonth=safeParse('omar_fixed_by_month', {});
let fixedOpen=true;
function persistFixed(){localStorage.setItem('omar_fixed_templates',JSON.stringify(fixedTemplates));localStorage.setItem('omar_fixed_by_month',JSON.stringify(fixedByMonth));try{if(window.syncToABOmar)syncToABOmar()}catch(e){}}
function getFixedForMonth(ym){
  if(!fixedByMonth[ym]){
    let keys=Object.keys(fixedByMonth).sort();
    if(keys.length){
      fixedByMonth[ym]=JSON.parse(JSON.stringify(fixedByMonth[keys[keys.length-1]]));
    }else{
      fixedByMonth[ym]=fixedTemplates.map(t=>({id:t.id,name:t.name,amount:t.def}));
    }
    // كمل لـ 12 لو ناقص
    while(fixedByMonth[ym].length<12){
      let newId='f_'+Date.now()+'_'+fixedByMonth[ym].length+'_'+Math.random().toString(16).slice(2);
      fixedByMonth[ym].push({id:newId,name:'',amount:0});
      if(!fixedTemplates.find(x=>x.id===newId)) fixedTemplates.push({id:newId,name:'',def:0});
    }
    persistFixed();
  }else{
    // لو الشهر موجود بس أقل من 12 كمله
    if(fixedByMonth[ym].length<12){
      while(fixedByMonth[ym].length<12){
        let newId='f_'+Date.now()+'_'+fixedByMonth[ym].length+'_'+Math.random().toString(16).slice(2);
        fixedByMonth[ym].push({id:newId,name:'',amount:0});
        if(!fixedTemplates.find(x=>x.id===newId)) fixedTemplates.push({id:newId,name:'',def:0});
      }
      persistFixed();
    }
  }
  return fixedByMonth[ym];
}


function deleteFixed(id){
  // بدل ما نمسح الصف، نمسح اللي جوة الخلايا بس عشان يفضل 12 بند
  let curList = getFixedForMonth(curYM);
  let item = curList.find(x=>x.id===id);
  let nameToDelete = item ? item.name : '';
  
  if(item){
    item.name='';
    item.amount=0;
  }
  let tmpl = fixedTemplates.find(x=>x.id===id);
  if(tmpl){
    tmpl.name='';
    tmpl.def=0;
  }
  // امسح من كل الشهور نفس البند (فضيه بس)
  Object.keys(fixedByMonth).forEach(ym=>{
    let it = fixedByMonth[ym].find(x=>x.id===id);
    if(it){ it.name=''; it.amount=0; }
  });
  // امسح من الإجمالي لو كان محفوظ
  if(nameToDelete){
    transactions = transactions.filter(t=>{
      if(t.fixedId===id) return false;
      if(t.isFixed && t.item===nameToDelete && t.date && t.date.startsWith(curYM)) return false;
      return true;
    });
    try{localStorage.setItem('omar_tx_v3',JSON.stringify(transactions));}catch(e){}
  }
  persistFixed();
  try{persist();}catch(e){}
  renderFixedSection();
  renderStats(curTab);
  try{renderSimple(curTab);}catch(e){}
  try{renderTotal();}catch(e){}
  toast('تم مسح اللي جوة الخلية ✅','ok');
}


function saveFixedExpenses(){
  let list=getFixedForMonth(curYM);
  if(!list||!list.length){toast('مفيش مصروفات ثابتة','err');return;}
  let dateToUse = curYM===new Date().toISOString().slice(0,7) ? new Date().toISOString().slice(0,10) : curYM+'-01';
  let count=0, updated=0;
  list.forEach(f=>{
    let amt=Number(f.amount)||0;
    let name=(f.name||'').trim();
    if(!name && amt===0) return; // فاضي خالص سيبه
    if(!name) return; // لازم اسم
    // لو موجود قبل كده في نفس الشهر حدثه
    let existing = transactions.find(t=>t.fixedId===f.id && t.date && t.date.startsWith(curYM));
    if(existing){
      if(amt===0){
        // لو صفر امسحه
        transactions = transactions.filter(t=>t.id!==existing.id);
      }else{
        existing.amount=amt;
        existing.item=name;
        existing.person=name;
        updated++;
      }
      return;
    }
    if(amt<=0) return;
    transactions.push({
      id:'fixed_'+f.id+'_'+curYM+'_'+Date.now()+Math.random().toString(16).slice(2),
      type:'expense',
      subType:'expense',
      item:name,
      person:name,
      wallet:'كاش',
      amount:amt,
      date:dateToUse,
      note:'مصروف ثابت - '+curYM,
      direction:'عليا',
      status:'',
      excludeFromBalance:false,
      isFixed:true,
      fixedId:f.id
    });
    count++;
  });
  try{localStorage.setItem('omar_tx_v3',JSON.stringify(transactions));}catch(e){}
  try{persist();}catch(e){}
  try{refreshCurrent();}catch(e){}
  try{renderTotal();}catch(e){}
  try{renderStats(curTab);}catch(e){}
  if(count>0 || updated>0){
    toast('تم حفظ '+(count+updated)+' بند في الإجمالي - '+count+' جديد و '+updated+' تحديث ✅','ok');
  }else{
    toast('مفيش حاجة جديدة للحفظ','err');
  }
}

function confirmFixedModal(){
  let name=document.getElementById('fixedNameInput').value.trim();
  let amount=Number(document.getElementById('fixedAmountInput').value.replace(/[^0-9]/g,''))||0;
  if(!name){alert('اكتب اسم البند');return;}
  let id=Date.now().toString()+'_'+Math.random().toString(16).slice(2);
  let newTpl={id,name,def:amount};
  fixedTemplates.push(newTpl);
  // لو وصلنا 12 وكنا بنزود فوق، سيبها تزيد - هتبقى 13 وطالع وترحل للشهور الجاية
  let curList=getFixedForMonth(curYM);
  curList.push({id,name,amount});
  persistFixed();
  closeFixedModal();
  renderFixedSection();
  renderStats(curTab);
  toast('تمت إضافة '+name+' وهيترحل للشهور الجاية ✅','ok');
}

function toggleFixedBox(){fixedOpen=!fixedOpen;document.getElementById('fixedBody').style.display=fixedOpen?'flex':'none';document.getElementById('fixedArrow').textContent=fixedOpen?'▼':'◀'}
function renderFixedSection(){
  let list=getFixedForMonth(curYM);
  document.getElementById('fixedTotalBadge').textContent=list.reduce((a,b)=>a+(Number(b.amount)||0),0).toLocaleString()+' ج';
  let html='';
  for(let i=0;i<list.length;i+=2){
    let f1=list[i];
    let f2=list[i+1];
    html+=`<div class="fixed-row-2">
      <input value="${f1.name}" onfocus="this.select()" onchange="editFixedName('${f1.id}',this.value)" placeholder="البند">
      <input type="text" inputmode="numeric" value="${f1.amount}" onfocus="this.select()" oninput="editFixedAmount('${f1.id}',this.value)">
      <button class="fixed-del-sm" onclick="deleteFixed('${f1.id}')">✕</button>
      ${f2?`
      <input value="${f2.name}" onfocus="this.select()" onchange="editFixedName('${f2.id}',this.value)" placeholder="البند">
      <input type="text" inputmode="numeric" value="${f2.amount}" onfocus="this.select()" onfocus="this.select()" oninput="editFixedAmount('${f2.id}',this.value)">
      <button class="fixed-del-sm" onclick="deleteFixed('${f2.id}')">✕</button>
      `:`<div></div><div></div><div></div>`}
    </div>`;
  }
  html+=`
  <div style="display:flex;gap:6px;margin-top:6px">
    <button onclick="openFixedModal()" style="flex:1;padding:8px;background:var(--hero);color:#fff;border:none;border-radius:8px;font-weight:900;font-size:10px">+ إضافة بند ثابت</button>
    <button onclick="saveFixedExpenses()" style="flex:1;padding:8px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:900;font-size:10px">💾 حفظ في الإجمالي</button>
  </div>`;
  document.getElementById('fixedBody').innerHTML=html;
  document.getElementById('fixedBody').style.display=fixedOpen?'flex':'none';
}
function editFixedName(id,val){let it=getFixedForMonth(curYM).find(x=>x.id===id);if(it)it.name=val;let tmpl=fixedTemplates.find(x=>x.id===id);if(tmpl)tmpl.name=val;persistFixed();}
function editFixedAmount(id,val){let num=Number(val.replace(/[^0-9]/g,''))||0;let it=getFixedForMonth(curYM).find(x=>x.id===id);if(it)it.amount=num;let tmpl=fixedTemplates.find(x=>x.id===id);if(tmpl)tmpl.def=num;persistFixed();document.getElementById('fixedTotalBadge').textContent=getFixedForMonth(curYM).reduce((a,b)=>a+(Number(b.amount)||0),0).toLocaleString()+' ج';renderStats(curTab);}
function openFixedModal(){document.getElementById('fixedNameInput').value='';document.getElementById('fixedAmountInput').value='';document.getElementById('fixedModal').classList.add('open');setTimeout(()=>document.getElementById('fixedNameInput').focus(),100);}
function closeFixedModal(){document.getElementById('fixedModal').classList.remove('open');}
function confirmFixedModal(){let name=document.getElementById('fixedNameInput').value.trim();let amount=Number(document.getElementById('fixedAmountInput').value.replace(/[^0-9]/g,''))||0;if(!name){alert('اكتب اسم البند');return;}let id=Date.now().toString();fixedTemplates.push({id,name,def:amount});getFixedForMonth(curYM).push({id,name,amount});persistFixed();closeFixedModal();renderFixedSection();renderStats(curTab);}
function addFixed(){openFixedModal();}




function persist(){try{if(window.syncToABOmar)syncToABOmar();if(window.parent&&window.parent.syncToABOmar)window.parent.syncToABOmar()}catch(e){}localStorage.setItem('omar_tx_v3',JSON.stringify(transactions));localStorage.setItem('omar_master_bands',JSON.stringify(masterBands));localStorage.setItem('omar_include_def',JSON.stringify(includeDeferredInBalance));try{window.dispatchEvent(new Event('omar_data_updated'));if(window.parent)window.parent.postMessage({type:'omar_data_updated'},'*')}catch(e){}}
function ensureMaster(){if(masterBands.length===0){masterBands=[{id:1,name:'الإيجار',section:'expense'},{id:2,name:'الكهرباء',section:'expense'},{id:3,name:'مبيعات',section:'income'},{id:4,name:'أحمد',section:'debt_due'},{id:5,name:'سامي',section:'amanat'}];}persist()}
function getBands(sec){return masterBands.filter(b=>b.section===sec).map(b=>b.name)}
function getMonthRange(ym){const[y,m]=ym.split('-').map(Number);const first=`${ym}-01`;const lastDay=new Date(y,m,0).getDate();const last=`${ym}-${String(lastDay).padStart(2,'0')}`;return{first,last,y,m}}
function shiftMonth(d){let[y,m]=curYM.split('-').map(Number);m+=d;if(m>12){m=1;y++}if(m<1){m=12;y--}curYM=`${y}-${String(m).padStart(2,'0')}`;updateMonthLabels();applyMonthToInputs();refreshCurrent()}
function updateMonthLabels(){const{y,m}=getMonthRange(curYM);const names=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];const label=`${names[m]} ${y}`;const sub=`${curYM}`;['expense','income','debt','amanat','total'].forEach(k=>{const el=document.getElementById('ml-'+k);if(el)el.textContent=label;const s=document.getElementById('ml-'+k+'-sub');if(s)s.textContent=sub})}
function applyMonthToInputs(){const{first,last}=getMonthRange(curYM);const map=[['exp','expense'],['inc','income'],['ama','amanat'],['debt','debt']];map.forEach(([p])=>{const f=document.getElementById(`f-${p}-from`);const t=document.getElementById(`f-${p}-to`);if(f&&t){f.value=first;t.value=last}})}

function clearAllFilters(){
  document.querySelectorAll('.fbar input, .fbar select').forEach(el=>{ el.value=''; });
  refreshCurrent();
  toast('تم مسح الفلاتر','ok');
}


let curYear = new Date().getFullYear();
function shiftYear(dir){ curYear+=dir; document.getElementById('ml-yearly').textContent=curYear; renderYearly(); }
function refreshCurrent(){
  if(curTab==='expense'){ try{ renderFixedSection(); }catch(e){} renderSimple('expense'); }
  else if(curTab==='income') renderSimple('income');
  else if(curTab==='debt') renderDebt();
  else if(curTab==='amanat') renderSimple('amanat');
  else if(curTab==='total') renderTotal();
  else if(curTab==='yearly') renderYearly();
  updateMonthLabels();
}

function renderYearly(){
  let year = curYear;
  document.getElementById('ml-yearly').textContent=year;
  document.getElementById('ml-yearly-sub').textContent='تقرير عام '+year+' (من أول ما بدأنا)';
  let yearTx = transactions.filter(t=>{ if(!t.date) return false; let d=new Date(t.date); return !isNaN(d) && d.getFullYear()===year; });
  let incomeYear = yearTx.filter(t=>t.type==='income' && !t.excludeFromBalance).reduce((s,x)=>s+Number(x.amount),0);
  let expenseYear = yearTx.filter(t=>t.type==='expense' && !t.excludeFromBalance).reduce((s,x)=>s+Number(x.amount),0);
  let dueO=0,dueL=0,defO=0,defL=0, amaIn=0, amaOut=0;
  yearTx.filter(t=>t.type==='debt').forEach(t=>{
    let amt=Number(t.amount)||0;
    if(t.subType==='debt_due' || t.status==='due'){ if(t.direction==='عليا') dueO+=amt; else dueL+=amt; }
    else { if(t.direction==='عليا') defO+=amt; else defL+=amt; }
  });
  yearTx.filter(t=>t.type==='amanat').forEach(t=>{
    let amt=Number(t.amount)||0;
    let dir=t.direction||t.typeAmanat||'إيداع';
    if(dir==='سحب' || t.note && t.note.includes('سحب')) amaOut+=amt; else amaIn+=amt;
  });
  let netYear = incomeYear - expenseYear + (dueL-dueO) + (includeDeferredInBalance ? (defL-defO) : 0);
  let netBase = incomeYear - expenseYear + (dueL-dueO);
  let amanatNet = amaIn - amaOut;

  document.getElementById('stats-yearly').innerHTML=`<div class="kpi-grid-5">
    <div class="stat pos"><small>إجمالي الدخل</small><b>${incomeYear.toLocaleString()}</b></div>
    <div class="stat neg"><small>إجمالي المصروف</small><b>${expenseYear.toLocaleString()}</b></div>
    <div class="stat neg"><small>إجمالي المستحق</small><b>${(dueL-dueO).toLocaleString()}</b></div>
    <div class="stat def ${includeDeferredInBalance?'active':'inactive'}" onclick="toggleDeferredInclude();renderYearly()"><span style="font-size:5px;background:${includeDeferredInBalance?'#dcfce7':'#fee2e2'};color:${includeDeferredInBalance?'#16a34a':'#ef4444'};padding:1px 4px;border-radius:10px">${includeDeferredInBalance?'✅ مفعلة':'❌ مخفية'}</span><small>إجمالي المؤجل</small><b>${(defL-defO).toLocaleString()}</b></div>
    <div class="stat neu"><small>الصافي</small><b>${netYear.toLocaleString()}</b></div>
  </div>`;
  document.getElementById('amanatYearlyBadge').textContent=amanatNet.toLocaleString()+' ج (إيداع '+amaIn.toLocaleString()+' - سحب '+amaOut.toLocaleString()+')';

  // حضر بيانات شهرية للرسم
  window._yearlyData = (()=> {
    let months = Array.from({length:12},(_,i)=>i);
    let incPerMonth = months.map(m=> yearTx.filter(t=>t.type==='income' && new Date(t.date).getMonth()===m && !t.excludeFromBalance).reduce((s,x)=>s+Number(x.amount),0));
    let expPerMonth = months.map(m=> yearTx.filter(t=>t.type==='expense' && new Date(t.date).getMonth()===m && !t.excludeFromBalance).reduce((s,x)=>s+Number(x.amount),0));
    let duePerMonth = months.map(m=> {
      let l=yearTx.filter(t=>t.type==='debt'&&(t.subType==='debt_due'||t.status==='due')&&new Date(t.date).getMonth()===m&&t.direction==='ليا').reduce((s,x)=>s+Number(x.amount),0);
      let o=yearTx.filter(t=>t.type==='debt'&&(t.subType==='debt_due'||t.status==='due')&&new Date(t.date).getMonth()===m&&t.direction==='عليا').reduce((s,x)=>s+Number(x.amount),0);
      return l-o;
    });
    let defPerMonth = months.map(m=> {
      let l=yearTx.filter(t=>t.type==='debt'&&(t.subType==='debt_def'||t.status==='def')&&new Date(t.date).getMonth()===m&&t.direction==='ليا').reduce((s,x)=>s+Number(x.amount),0);
      let o=yearTx.filter(t=>t.type==='debt'&&(t.subType==='debt_def'||t.status==='def')&&new Date(t.date).getMonth()===m&&t.direction==='عليا').reduce((s,x)=>s+Number(x.amount),0);
      return l-o;
    });
    let amaPerMonth = months.map(m=>{
      let inn=yearTx.filter(t=>t.type==='amanat'&&new Date(t.date).getMonth()===m&& (t.direction==='إيداع'||!t.direction||t.direction==='')).reduce((s,x)=>s+Number(x.amount),0);
      let out=yearTx.filter(t=>t.type==='amanat'&&new Date(t.date).getMonth()===m&& t.direction==='سحب').reduce((s,x)=>s+Number(x.amount),0);
      return inn-out;
    });
    let netPerMonth = months.map((_,i)=> incPerMonth[i]-expPerMonth[i]+duePerMonth[i]+(includeDeferredInBalance?defPerMonth[i]:0));
    return {incPerMonth, expPerMonth, duePerMonth, defPerMonth, amaPerMonth, netPerMonth, months};
  })();

  renderYearlyChart();
  renderYearlyTable();
}

function drawYearlyLineMulti(canvasId, sets){
  let c=document.getElementById(canvasId); if(!c) return;
  let ctx=c.getContext('2d');
  let w=c.width=c.offsetWidth*2; let h=c.height=200*2;
  ctx.clearRect(0,0,w,h);
  let allVals=[]; Object.values(sets).forEach(arr=>{ if(arr) allVals.push(...arr.map(v=>Math.abs(v))); });
  let maxVal=Math.max(...allVals,1)*1.2;
  let pad=40*2; let chartW=w-pad*2; let chartH=h-pad*1.5;
  ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ let y=pad + (chartH/4)*i; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
  function drawLine(data, color){
    if(!data) return;
    ctx.strokeStyle=color; ctx.lineWidth=2.5*2; ctx.beginPath();
    data.forEach((v,i)=>{
      let x=pad + (chartW/11)*i;
      let y=pad + chartH - (Math.abs(v)/maxVal)*chartH - (v<0?0:0);
      // للبساطة نرسم بالقيمة المطلقة مع إشارة اللون يوضح
      let normY = pad + chartH/2 - (v/maxVal)*(chartH/2*0.9);
      if(i===0) ctx.moveTo(x,normY); else ctx.lineTo(x,normY);
    });
    ctx.stroke();
    ctx.fillStyle=color;
    data.forEach((v,i)=>{
      let x=pad + (chartW/11)*i;
      let normY = pad + chartH/2 - (v/maxVal)*(chartH/2*0.9);
      ctx.beginPath(); ctx.arc(x,normY,3.5*2,0,Math.PI*2); ctx.fill();
    });
  }
  if(sets.inc) drawLine(sets.inc, '#16a34a');
  if(sets.exp) drawLine(sets.exp, '#ef4444');
  if(sets.due) drawLine(sets.due, '#f59e0b');
  if(sets.def) drawLine(sets.def, '#8b5cf6');
  if(sets.ama) drawLine(sets.ama, '#06b6d4');
  if(sets.net) drawLine(sets.net, '#0F766E');
  ctx.fillStyle='#6b7280'; ctx.font=(10*2)+'px Tajawal'; ctx.textAlign='center';
  for(let i=0;i<12;i++){ let x=pad + (chartW/11)*i; ctx.fillText((i+1).toString(), x, h-5*2); }
  // وسيلة إيضاح
  let lx=pad, ly=8*2;
  let legends=[['#16a34a','دخل',sets.inc],['#ef4444','مصروف',sets.exp],['#f59e0b','مستحق',sets.due],['#8b5cf6','مؤجل',sets.def],['#06b6d4','أمانات',sets.ama],['#0F766E','صافي',sets.net]];
  legends.forEach(([col,lab,arr])=>{
    if(!arr) return;
    ctx.fillStyle=col; ctx.fillRect(lx, ly, 10*2, 5*2);
    ctx.fillStyle='#111'; ctx.font=(9*2)+'px Tajawal'; ctx.textAlign='left'; ctx.fillText(lab, lx+14*2, ly+5*2);
    lx+=50*2;
    if(lx>w-100*2){ lx=pad; ly+=12*2; }
  });
}
function drawYearlyLine
(canvasId, inc, exp, net){
  let c=document.getElementById(canvasId); if(!c) return;
  let ctx=c.getContext('2d');
  let w=c.width=c.offsetWidth*2; let h=c.height=180*2;
  ctx.clearRect(0,0,w,h);
  let maxVal=Math.max(...inc, ...exp, ...net.map(Math.abs), 1);
  maxVal=maxVal*1.2;
  let pad=40*2; let chartW=w-pad*2; let chartH=h-pad*1.5;
  // شبكة
  ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ let y=pad + (chartH/4)*i; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
  function drawLine(data, color){
    ctx.strokeStyle=color; ctx.lineWidth=3*2; ctx.beginPath();
    data.forEach((v,i)=>{
      let x=pad + (chartW/11)*i;
      let y=pad + chartH - (v/maxVal)*chartH;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // نقاط
    ctx.fillStyle=color;
    data.forEach((v,i)=>{
      let x=pad + (chartW/11)*i;
      let y=pad + chartH - (v/maxVal)*chartH;
      ctx.beginPath(); ctx.arc(x,y,4*2,0,Math.PI*2); ctx.fill();
    });
  }
  drawLine(inc, '#16a34a');
  drawLine(exp, '#ef4444');
  drawLine(net, '#0F766E');
  // تسميات الشهور
  ctx.fillStyle='#6b7280'; ctx.font=(10*2)+'px Tajawal'; ctx.textAlign='center';
  for(let i=0;i<12;i++){ let x=pad + (chartW/11)*i; ctx.fillText((i+1).toString(), x, h-5*2); }
  // وسيلة إيضاح
  ctx.textAlign='left';
  ctx.fillStyle='#16a34a'; ctx.fillRect(pad, 8*2, 12*2, 6*2); ctx.fillText('دخل', pad+18*2, 13*2);
  ctx.fillStyle='#ef4444'; ctx.fillRect(pad+60*2, 8*2, 12*2, 6*2); ctx.fillText('مصروف', pad+78*2, 13*2);
  ctx.fillStyle='#0F766E'; ctx.fillRect(pad+130*2, 8*2, 12*2, 6*2); ctx.fillText('صافي', pad+148*2, 13*2);
}

function drawYearlyBar(canvasId, net){
  let c=document.getElementById(canvasId); if(!c) return;
  let ctx=c.getContext('2d');
  let w=c.width=c.offsetWidth*2; let h=c.height=160*2;
  ctx.clearRect(0,0,w,h);
  let maxVal=Math.max(...net.map(v=>Math.abs(v)),1)*1.2;
  let pad=40*2; let chartW=w-pad*2; let chartH=h-pad*1.5;
  let barW=chartW/12*0.6;
  net.forEach((v,i)=>{
    let x=pad + (chartW/12)*i + (chartW/12 - barW)/2;
    let barH = (Math.abs(v)/maxVal)*chartH*0.8;
    let y = v>=0 ? (pad + chartH/2 - barH) : (pad + chartH/2);
    ctx.fillStyle=v>=0 ? '#16a34a' : '#ef4444';
    ctx.fillRect(x, y, barW, barH);
  });
  // خط الصفر
  ctx.strokeStyle='#111'; ctx.lineWidth=1*2; ctx.beginPath(); ctx.moveTo(pad, pad+chartH/2); ctx.lineTo(w-pad, pad+chartH/2); ctx.stroke();
  ctx.fillStyle='#6b7280'; ctx.font=(10*2)+'px Tajawal'; ctx.textAlign='center';
  for(let i=0;i<12;i++){ let x=pad + (chartW/12)*i + chartW/24; ctx.fillText((i+1).toString(), x, h-5*2); }
}

function renderTotal(){
  try{ renderStats('total'); }catch(e){}
  const q=(document.getElementById('f-total-q')?.value||'').trim();
  const months=Array.from({length:12},(_,i)=>i+1);
  const sections=[
    {key:'wallet',title:'المحافظ',isWallet:true},
    {key:'income',title:'الدخل',filter:t=>t.type==='income'},
    {key:'expense',title:'المصروف',filter:t=>t.type==='expense'},
    {key:'debt_due',title:'الديون المستحقة',filter:t=>t.subType==='debt_due'||(t.type==='debt'&&t.status==='due')},
    {key:'debt_def',title:'الديون المؤجلة',filter:t=>t.subType==='debt_def'||(t.type==='debt'&&t.status==='def')},
    {key:'amanat',title:'الأمانات',filter:t=>t.type==='amanat'}
  ];
  let html='';
  sections.forEach(sec=>{
    if(sec.isWallet){
      let walletNames=wallets.filter(w=>w!=='الأمانات');
      if(q) walletNames=walletNames.filter(n=>n.includes(q));
      const monthFiltered=transactions.filter(t=>t.date&&t.date.startsWith(curYM)&&walletNames.includes(t.wallet));
      const monthLabel=`${curYM.slice(5,7)}-${curYM.slice(0,4)}`;
      const monthSum=monthFiltered.reduce((a,b)=>a+(Number(b.amount)||0),0);
      html+=`<div class="total-header"><span></span><span style="font-size:12px;font-weight:900">${monthSum.toLocaleString()}</span><b>${sec.title} (${monthLabel})</b></div>`;
      if(!walletNames.length){ html+=`<div style="padding:10px;text-align:center;color:var(--text-soft);background:var(--card);border:1px solid var(--card-border);border-radius:8px;margin-bottom:10px">فاضي</div>`; return; }
      html+=`<div class="tsec total-sec"><div class="twrap"><table><thead><tr><th style="min-width:80px">بند</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>إجمالي</th></tr></thead><tbody>`;
      let walletAllTotals=Array(12).fill(0);
      walletNames.forEach(wName=>{
        const items=transactions.filter(t=>t.wallet===wName);
        const perMonth=Array(12).fill(0);
        items.forEach(t=>{const d=new Date(t.date); if(!isNaN(d)) perMonth[d.getMonth()]+=(Number(t.amount)||0);});
        perMonth.forEach((v,i)=> walletAllTotals[i]+=v);
        const total=perMonth.reduce((a,c)=>a+c,0);
        let safeW = wName.replace(/"/g,'&quot;');
        html+=`<tr><td style="font-weight:900;cursor:pointer" data-wname="${safeW}" onclick="openWalletMenu(this.dataset.wname)">${wName}</td>${perMonth.map((v,i)=>`<td data-wname="${safeW}" data-m="${i}" onclick="showTxListForWallet(this.dataset.wname, parseInt(this.dataset.m))" style="cursor:pointer">${v?v.toLocaleString():'-'}</td>`).join('')}<td style="font-weight:900;color:var(--hero)">${total.toLocaleString()}</td></tr>`;
      });
      let wGrand=walletAllTotals.reduce((a,c)=>a+c,0);
      html+=`</tbody><tfoot><tr style="background:#0F766E!important;color:#fff!important;font-weight:900"><td style="color:#fff!important;background:#0F766E!important">الإجمالي</td>${walletAllTotals.map(v=>`<td style="color:#fff!important;background:#0F766E!important">${v.toLocaleString()}</td>`).join('')}<td style="color:#fff!important;background:#0F766E!important">${wGrand.toLocaleString()}</td></tr></tfoot></table></div></div>`;
      return;
    }
    let bands=masterBands.filter(b=>b.section===sec.key);
    const existNames=new Set(bands.map(b=>b.name));
    transactions.filter(sec.filter).forEach(t=>{
      const nm=(t.person||t.item||'').trim();
      if(nm && !existNames.has(nm)){
        masterBands.push({id:Date.now()+Math.random()*1000,name:nm,section:sec.key});
        existNames.add(nm);
        bands.push({name:nm,section:sec.key});
      }
    });
    if(q) bands=bands.filter(b=>b.name.includes(q));
    let list=transactions.filter(sec.filter);
    const monthFiltered=list.filter(t=>t.date&&t.date.startsWith(curYM));
    const monthLabel=`${curYM.slice(5,7)}-${curYM.slice(0,4)}`;
    const monthSum=monthFiltered.reduce((a,b)=>a+(Number(b.amount)||0),0);
    html+=`<div class="total-header"><button class="add-row-btn" onclick="addNewRow('${sec.key}')">+ بند</button><span style="font-size:12px;font-weight:900">${monthSum.toLocaleString()}</span><b>${sec.title} (${monthLabel})</b></div>`;
    if(!bands.length){
      html+=`<div class="tsec total-sec"><div class="twrap"><table><thead><tr><th style="min-width:80px">بند</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>إجمالي</th></tr></thead><tbody><tr><td colspan="${months.length+2}" style="padding:10px;color:var(--text-soft)">فاضي - دوس + بند</td></tr></tbody></table></div></div>`;
      return;
    }
    html+=`<div class="tsec total-sec"><div class="twrap"><table><thead><tr><th style="min-width:80px">بند</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>إجمالي</th></tr></thead><tbody>`;
    let allTotals=Array(12).fill(0);
    bands.forEach(b=>{
      const band=b.name;
      const items=list.filter(t=> (t.item===band || t.person===band) );
      const perMonth=Array(12).fill(0);
      items.forEach(t=>{
        const d=new Date(t.date); if(isNaN(d)) return;
        let amt=Number(t.amount)||0;
        if(sec.key==='amanat' && (t.direction||'إيداع')==='سحب') amt=-amt;
        perMonth[d.getMonth()]+=amt;
      });
      perMonth.forEach((v,i)=> allTotals[i]+=v);
      const total=perMonth.reduce((a,c)=>a+c,0);
      let safeB = band.replace(/"/g,'&quot;');
      html+=`<tr><td data-band="${safeB}" data-sec="${sec.key}" onclick="openBandMenu(this.dataset.band, this.dataset.sec)" style="cursor:pointer;font-weight:900">${band}</td>${perMonth.map((v,i)=>`<td data-band="${safeB}" data-m="${i}" onclick="showTxListForCell(this.dataset.band, parseInt(this.dataset.m))" style="cursor:pointer">${v?v.toLocaleString():'-'}</td>`).join('')}<td style="font-weight:900;color:var(--hero)">${total.toLocaleString()}</td></tr>`;
    });
    let gTotal=allTotals.reduce((a,c)=>a+c,0);
    html+=`</tbody><tfoot><tr style="background:#0F766E!important;color:#fff!important;font-weight:900"><td style="color:#fff!important;background:#0F766E!important">الإجمالي</td>${allTotals.map(v=>`<td style="color:#fff!important;background:#0F766E!important">${v.toLocaleString()}</td>`).join('')}<td style="color:#fff!important;background:#0F766E!important">${gTotal.toLocaleString()}</td></tr></tfoot></table></div></div>`;
  });
  let el=document.getElementById('t-total');
  if(el) el.innerHTML=html;
}






function openEdit(id){
  let t=transactions.find(x=>x.id===id);
  if(!t){toast('الحركة مش موجودة','err');return;}
  editingId=id;
  excludeFromBalanceCurrent=!!t.excludeFromBalance;
  try{updateExcludeBtn()}catch(e){}
  if(t.type==='debt' || t.subType==='debt_due' || t.subType==='debt_def'){
    cardTab='debt';
  }else if(t.type==='amanat'){
    cardTab='amanat';
  }else if(t.type==='income'){
    cardTab='income';
  }else{
    cardTab='expense';
  }
  switchCardTab(cardTab);
  if(cardTab==='expense' || cardTab==='income'){
    document.getElementById('a-item').value=t.item||t.person||'';
    document.getElementById('a-wallet').value=t.wallet||wallets[0]||'كاش';
    document.getElementById('a-amount').value=t.amount||'';
    document.getElementById('a-date').value=t.date||new Date().toISOString().slice(0,10);
    document.getElementById('a-note').value=t.note||'';
  }else if(cardTab==='debt'){
    document.getElementById('a-person-debt').value=t.person||t.item||'';
    document.getElementById('a-wallet-debt').value=t.wallet||wallets[0]||'كاش';
    document.getElementById('a-amount-debt').value=t.amount||'';
    document.getElementById('a-direction').value=t.direction||'عليا';
    document.getElementById('a-status').value=(t.subType==='debt_def'||t.status==='def')?'def':'due';
    let dateEl=document.getElementById('a-date-debt');
    if(dateEl) dateEl.value=t.date||'';
    let noteEl=document.getElementById('a-note-debt');
    if(noteEl) noteEl.value=t.note||'';
  }else if(cardTab==='amanat'){
    document.getElementById('a-person-ama').value=t.person||t.item||'';
    document.getElementById('a-amount-ama').value=t.amount||'';
    document.getElementById('a-date-ama').value=t.date||new Date().toISOString().slice(0,10);
    document.getElementById('a-note-ama').value=t.note||'';
    let amanatType=document.getElementById('a-amanat-type');
    if(amanatType) amanatType.value=t.direction||'إيداع';
  }
  let delBtn=document.getElementById('btnDelete');
  if(delBtn) delBtn.style.display='flex';
  document.getElementById('addModal').classList.add('open');
}


function showTxListForWallet(walletName, monthIdx){
  let year = curYM ? parseInt(curYM.slice(0,4)) : new Date().getFullYear();
  let list = transactions.filter(t=>{
    if(t.wallet!==walletName) return false;
    let d=new Date(t.date);
    return d.getFullYear()==year && d.getMonth()==monthIdx;
  });
  if(!list.length){toast('مفيش حركات في '+walletName+' للشهر ده','err');return;}
  if(list.length===1){ openEdit(list[0].id); return; }
  let html = list.map(t=>`<div onclick="closePrompt();restoreDialog();openEdit('${t.id}')" style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;cursor:pointer"><span>${t.date} - ${t.item||t.person} </span><b>${Number(t.amount).toLocaleString()}</b></div>`).join('');
  let dialog=document.getElementById('customPrompt');
  dialog.innerHTML=`<div class="dialog-box" style="max-height:70vh;overflow:auto"><h4>${walletName} - شهر ${monthIdx+1}</h4><div>${html}</div><div class="dialog-actions"><button class="btn-cancel" onclick="closePrompt();restoreDialog()">إغلاق</button></div></div>`;
  dialog.classList.add('open');
}

function renameWallet(oldName){
  showPrompt('تعديل اسم المحفظة', oldName, (newName)=>{
    if(!newName) return;
    newName=newName.trim();
    if(!newName || newName===oldName) return;
    if(wallets.includes(newName)){ toast('الاسم ده موجود بالفعل','err'); return; }
    // حدث قائمة المحافظ
    let idx=wallets.indexOf(oldName);
    if(idx>=0) wallets[idx]=newName; else wallets.push(newName);
    localStorage.setItem('omar_wallets_v3', JSON.stringify(wallets));
    // حدث كل المعاملات
    let changed=0;
    transactions.forEach(t=>{ if(t.wallet===oldName){ t.wallet=newName; changed++; } });
    // حدث الثابتة؟ لا
    try{localStorage.setItem('omar_tx_v3', JSON.stringify(transactions));}catch(e){}
    try{persist();}catch(e){}
    try{renderTotal();}catch(e){}
    try{refreshCurrent();}catch(e){}
    try{renderStats(curTab);}catch(e){}
    // حدث السيلكتات
    try{
      document.querySelectorAll('select[id^="a-wallet"]').forEach(sel=>{
        if(sel){
          let val=sel.value;
          sel.innerHTML=wallets.map(w=>`<option ${w===newName?'selected':''}>${w}</option>`).join('');
          if(val===oldName) sel.value=newName; else sel.value=val;
        }
      });
      let fWallet=document.getElementById('f-exp-w');
      if(fWallet){
        fWallet.innerHTML='<option value="">محفظة</option>'+wallets.map(w=>`<option>${w}</option>`).join('');
      }
    }catch(e){}
    toast('تم تغيير '+oldName+' إلى '+newName+' في '+changed+' حركة ✅','ok');
  });
}

function handleMediaType(sel){

  let input=document.getElementById('mediaFile');
  if(!input) return;
  if(type==='camera'){ input.setAttribute('capture','environment'); input.accept='image/*'; input.click(); }
  else if(type==='image'){ input.removeAttribute('capture'); input.accept='image/*'; input.click(); }
  else if(type==='voice'){ toast('التسجيل الصوتي قريباً 🎙️','ok'); sel.value=''; return; }
}

      masterBands.push({id:Date.now(),name:newName,section:sec});

}else if(type==='amanat'){

      document.getElementById('a-person-ama').value=newName;
      persist();
      setTimeout(()=>saveTx(),200);
    });
    return;

}

// V10 Search System
let globalSearchQuery = '';
let globalSearchFilter = 'all';
let reportVisible = false;

function onGlobalSearch(v){
  globalSearchQuery = (v||'').trim().toLowerCase();
  refreshCurrent();
  updateSearchStats();
}
function setSearchFilter(f){
  globalSearchFilter = f;
  document.querySelectorAll('#searchChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  refreshCurrent();
  updateSearchStats();
}
function getFilteredBySearch(list){
  if(!globalSearchQuery && globalSearchFilter==='all') return list;
  return list.filter(t=>{
    if(globalSearchFilter!=='all'){
      let typeMap = {expense:'expense',income:'income',debt_due:'debt_due',debt_def:'debt_def',amanat:'amanat'};
      let want = typeMap[globalSearchFilter];
      let is = t.subType || t.type + (t.status ? '_'+(t.status==='due'?'due':'def') : '');
      if(t.type==='debt'){ is = t.subType || (t.status==='due'?'debt_due':'debt_def'); }
      if(want!==is && want!==t.type) return false;
    }
    if(!globalSearchQuery) return true;
    let q=globalSearchQuery;
    let hay = [t.item,t.person,t.wallet,t.note,t.amount,t.date,t.direction,t.status].join(' ').toLowerCase();
    // support amount search
    return hay.includes(q);
  });
}
function updateSearchStats(){
  if(!globalSearchQuery && globalSearchFilter==='all'){ document.getElementById('searchStats').textContent=''; return; }
  let all = getFilteredBySearch(transactions);
  let sum = all.reduce((s,x)=>s+Number(x.amount||0),0);
  document.getElementById('searchStats').textContent = `النتائج: ${all.length} حركة - الإجمالي: ${sum.toLocaleString()}`;
}

// Hook into refresh
const _origRefresh = refreshCurrent;
refreshCurrent = function(){
  try{_origRefresh();}catch(e){ console.error(e); }
  try{ applyGlobalSearchToTables(); }catch(e){}
}

function applyGlobalSearchToTables(){
  if(!globalSearchQuery && globalSearchFilter==='all') return;
  // highlight rows in current tables
  document.querySelectorAll('table tbody tr').forEach(tr=>{
    let text = tr.textContent.toLowerCase();
    if(globalSearchQuery && !text.includes(globalSearchQuery)) tr.style.display='none';
    else tr.style.display='';
    if(globalSearchQuery && text.includes(globalSearchQuery)) tr.classList.add('highlight-row');
    else tr.classList.remove('highlight-row');
  });
}

function toggleReportBox(){
  reportVisible = !reportVisible;
  document.getElementById('reportBox').style.display = reportVisible ? 'block' : 'none';
  if(reportVisible){
    // fill wallets
    let sel=document.getElementById('rep-wallet');
    if(sel && wallets){ sel.innerHTML='<option value="">كل المحافظ</option>'+wallets.map(w=>`<option>${w}</option>`).join(''); }
    // default dates to current month
    try{ let r=getMonthRange(curYM); document.getElementById('rep-from').value=r.first; document.getElementById('rep-to').value=r.last; }catch(e){}
  }
}
function runReport(){
  let from=document.getElementById('rep-from').value;
  let to=document.getElementById('rep-to').value;
  let type=document.getElementById('rep-type').value;
  let wallet=document.getElementById('rep-wallet').value;
  let min=Number(document.getElementById('rep-min').value||0);
  let max=Number(document.getElementById('rep-max').value||0);
  let person=(document.getElementById('rep-person').value||'').toLowerCase();

  let list=transactions.filter(t=>{
    if(from && t.date < from) return false;
    if(to && t.date > to) return false;
    if(wallet && t.wallet!==wallet) return false;
    if(type!=='all'){
      if(type==='debt_due' && t.subType!=='debt_due' && !(t.type==='debt'&&t.status==='due')) return false;
      if(type==='debt_def' && t.subType!=='debt_def' && !(t.type==='debt'&&t.status==='def')) return false;
      if(['expense','income','amanat'].includes(type) && t.type!==type) return false;
    }
    if(min && Number(t.amount)<min) return false;
    if(max && Number(t.amount)>max) return false;
    if(person){
      let hay=[t.item,t.person,t.note].join(' ').toLowerCase();
      if(!hay.includes(person)) return false;
    }
    return true;
  });
  list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  let sum=list.reduce((s,x)=>s+Number(x.amount||0),0);
  let inc=list.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0);
  let exp=list.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);

  let html=`<div style="display:flex;gap:6px;margin-bottom:6px"><div class="stat pos" style="flex:1"><small>دخل</small><b>${inc.toLocaleString()}</b></div><div class="stat neg" style="flex:1"><small>مصروف</small><b>${exp.toLocaleString()}</b></div><div class="stat neu" style="flex:1"><small>الإجمالي</small><b>${sum.toLocaleString()}</b></div><div class="stat" style="flex:1"><small>عدد</small><b>${list.length}</b></div></div>`;
  html+=`<div class="twrap"><table><thead><tr><th>تاريخ</th><th>نوع</th><th>بند</th><th>محفظة</th><th>مبلغ</th><th>ملاحظة</th></tr></thead><tbody>`;
  if(!list.length) html+=`<tr><td colspan="6" style="color:var(--text-soft)">لا يوجد نتائج</td></tr>`;
  else list.slice(0,200).forEach(t=>{
    html+=`<tr><td>${t.date||''}</td><td>${t.type}</td><td>${(t.person||t.item||'')}</td><td>${t.wallet||''}</td><td>${Number(t.amount).toLocaleString()}</td><td>${t.note||''}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  if(list.length>200) html+=`<div style="font-size:9px;color:var(--text-soft);margin-top:4px">عرض 200 من ${list.length} - صدّر لعرض الكل</div>`;
  document.getElementById('reportResult').innerHTML=html;
  window._lastReport=list;
}
function clearReport(){
  ['rep-from','rep-to','rep-min','rep-max','rep-person'].forEach(id=>{ let el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('rep-type').value='all'; document.getElementById('rep-wallet').value='';
  document.getElementById('reportResult').innerHTML='';
}
function exportSearch(){
  let list = window._lastReport || getFilteredBySearch(transactions);
  if(!list.length){ toast('لا يوجد بيانات للتصدير','err'); return; }
  let csv = 'date,type,item,person,wallet,amount,note,direction,status\n' + list.map(t=>`"${t.date||''}","${t.type}","${(t.item||'').replace(/"/g,'')}","${(t.person||'').replace(/"/g,'')}","${t.wallet||''}",${t.amount},"${(t.note||'').replace(/"/g,'')}","${t.direction||''}","${t.status||''}"`).join('\n');
  let blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  let url = URL.createObjectURL(blob);
  let a=document.createElement('a'); a.href=url; a.download='report_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('تم التصدير ✅','ok');
}

function filterYearlyTable(q){
  q=(q||'').toLowerCase();
  document.querySelectorAll('#yearlyDetailsWrap table tbody tr').forEach(tr=>{
    tr.style.display = q && !tr.textContent.toLowerCase().includes(q) ? 'none' : '';
  });
}
